<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ElecStock</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/ElecStock.UI/app.css" />
    <link rel="icon" href="data:," />
    <script>
        // Theme before the first paint (no flash of the wrong theme).
        try {
            var t = localStorage.getItem("elecstock.theme");
            if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) { }
    </script>
</head>
<body>
    <div id="app"><div style="padding:24px;font-family:sans-serif;color:#888">Loading…</div></div>
    <!-- MAUI starts Blazor once its native bridge is ready; autostarting breaks Android (window.external not there yet) -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
